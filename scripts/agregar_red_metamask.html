<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectar MetaMask — Catalyst Network</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060e06; color: #c8e6c8; font-family: 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .card {
      background: #0a1a0a; border: 1px solid #2a5a2a; border-radius: 12px;
      padding: 40px; max-width: 480px; text-align: center;
    }
    h1 { color: #7dff7d; font-size: 22px; margin-bottom: 8px; }
    p { color: #6a8a6a; margin-bottom: 24px; font-size: 14px; }
    button {
      background: #0d1f0d; color: #7dff7d; border: 2px solid #3a7a3a;
      padding: 14px 32px; border-radius: 8px; font-size: 16px; cursor: pointer;
      font-weight: 600; width: 100%; margin-bottom: 12px;
      transition: all 0.2s;
    }
    button:hover { background: #1a3a1a; border-color: #7dff7d; }
    button.secondary { border-color: #4a6a4a; color: #9abe9a; font-size: 13px; }
    #status { margin-top: 20px; font-size: 13px; font-family: monospace; padding: 12px; border-radius: 8px; }
    .success { background: rgba(125,255,125,0.1); color: #7dff7d; }
    .error { background: rgba(255,74,106,0.1); color: #ff4a6a; }
    .info { background: rgba(74,240,255,0.1); color: #4af0ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>◆ Catalyst Local Network</h1>
    <p>Agregá la red local de Catalyst (Hardhat) a MetaMask.<br>Chain ID: 31337 | 10,000 ETH en Account #0</p>

    <button onclick="addNetwork()">⚡ Agregar Red a MetaMask</button>
    <button class="secondary" onclick="connectWallet()">🔌 Conectar Wallet</button>

    <div id="status"></div>
  </div>

  <script>
    const NETWORK = {
      chainId: '0x7A69',
      chainName: 'Catalyst Local (Hardhat)',
      nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
      rpcUrls: ['http://127.0.0.1:8545'],
      blockExplorerUrls: null,
    };

    function status(msg, cls) {
      document.getElementById('status').innerHTML = msg;
      document.getElementById('status').className = cls;
    }

    async function addNetwork() {
      if (!window.ethereum) {
        status('❌ MetaMask no detectado.<br>Instalalo en <a href="https://metamask.io" style="color:#ff9a4a">metamask.io</a>', 'error');
        return;
      }
      try {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [NETWORK],
        });
        status('✅ Red agregada a MetaMask!<br>Cambiá a "Catalyst Local" en MetaMask.', 'success');
      } catch (err) {
        if (err.code === 4001) {
          status('⚠️ Cancelaste la operación.', 'info');
        } else {
          status('❌ Error: ' + err.message, 'error');
        }
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        status('❌ MetaMask no detectado.', 'error');
        return;
      }
      try {
        // Primero cambiar a la red Catalyst
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x7A69' }],
          });
        } catch (e) {
          await addNetwork();
        }
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        status('✅ Conectado!<br>Cuenta: ' + accounts[0], 'success');
      } catch (err) {
        status('❌ ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
