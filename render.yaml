services:
  # ── Catalyst API Backend ──
  - type: web
    name: catalyst-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt httpx
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_BACKEND
        value: sqlite
      - key: GETH_RPC_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://catalyst-studio.onrender.com,http://localhost:5173"
      - key: ADMIN_ADDRESSES
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /health

  # ── Catalyst Studio Frontend ──
  - type: web
    name: catalyst-studio
    env: static
    region: oregon
    plan: starter
    buildCommand: cd apps/catalyst-studio && npm install --legacy-peer-deps && npm run build
    staticPublishPath: apps/catalyst-studio/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://catalyst-api.onrender.com
