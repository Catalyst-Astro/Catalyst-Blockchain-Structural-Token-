name: Hardhat CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  hardhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Compile
        run: npx hardhat compile
      - name: Test (soft-fail si aún no hay tests)
        run: npx hardhat test || echo "No tests or tests failing"