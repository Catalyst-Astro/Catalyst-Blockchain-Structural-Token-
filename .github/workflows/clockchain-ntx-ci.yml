name: Clockchain NTX CI

on:
  push:
    branches: [ main, master ]
    paths:
      - "docs/clockchain/**"
      - "scripts/clockchain/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clockchain-ntx-ci.yml"
  pull_request:
    paths:
      - "docs/clockchain/**"
      - "scripts/clockchain/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clockchain-ntx-ci.yml"
  workflow_dispatch:

jobs:
  ntx_validate:
    name: Validate Clockchain Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run NTX validation
        run: npm run clockchain:validate:ci

      - name: Publish traceability summary
        run: |
          echo "## Clockchain traceability" >> $GITHUB_STEP_SUMMARY
          cat artifacts/clockchain/traceability-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload traceability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clockchain-traceability
          path: artifacts/clockchain/
