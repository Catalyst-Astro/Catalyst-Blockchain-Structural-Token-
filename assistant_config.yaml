deepseek:
  api_key: ${DEEPSEEK_API_KEY}        # desde variable de entorno
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"              # más económico que v3/reasoner
  # Alternativas (de menor a mayor costo):
  #   deepseek-chat       ~$0.14/M tokens input,  $0.28/M output  ← AHORA
  #   deepseek-reasoner   ~$0.55/M tokens input,  $2.19/M output
  #   deepseek-v3         ~$0.27/M tokens input,  $1.10/M output
  max_tokens: 512                     # reducido de 1024 → ahorra 50%
  reasoning_effort: "medium"          # medium = balance costo/calidad
  thinking_enabled: false

asistente:
  voz_activada: false
  comando_salida: ["salir", "exit", "adiós"]
  tiempo_escucha: 5
  usar_api: true

arke:
  icd_umbral: 0.75
  registrar_bitacora: true

# ── Optimización de Costos ──
# 1. deepseek-chat es 8x más barato que deepseek-reasoner
# 2. max_tokens: 512 → ~$0.00014 USD por request
# 3. Para comprar más tokens: https://platform.deepseek.com
#    - $2 USD = ~7 millones de tokens (suficiente para ~14,000 requests)
#    - $5 USD = ~17.5 millones de tokens (~35,000 requests)
# 4. DEEPSEEK_API_KEY se configura en el .env de la raíz