repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.7
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
  - repo: https://github.com/trailofbits/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: ["--strict"]
  - repo: local
    hooks:
      - id: safety
        name: safety
        entry: safety check --full-report
        language: system
        pass_filenames: false
  - repo: https://github.com/GitGuardian/ggshield
    rev: v1.41.0
    hooks:
      - id: ggshield
        args: ["secret", "scan", "pre-commit", "--all-secrets"]
