[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalmanagergtk"
version = "0.1.0"
description = "GTK interface for Fractal blockchain management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyGObject",
    "web3>=6",
]

[project.scripts]
fractalmanagergtk = "fractalmanagergtk:main"
